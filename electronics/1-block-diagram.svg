<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-size="12">
  <style>
  .bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--line);stroke-width:1}
  .pwr{stroke:var(--rail);stroke-width:2.2} .bus{stroke:var(--bus);stroke-width:1.6}
  .i2c{stroke:var(--i2c);stroke-width:1.4} .sig{stroke:var(--sig);stroke-width:1.1}
  .t{fill:var(--ink);font-family:'IBM Plex Sans',-apple-system,Arial,sans-serif}
  .m{fill:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace}
  .lbl{fill:var(--ink2);font-family:'IBM Plex Mono',monospace}
  .net{fill:var(--bus);font-family:'IBM Plex Mono',monospace}
  .unk{fill:var(--unk)}
  :root{--bg:#f7f6f2;--card:#fff;--line:#d9d4c8;--ink:#1c2733;--ink2:#5b6570;
        --rail:#c0452e;--bus:#2f6f8f;--i2c:#8a6d10;--sig:#7a8390;--unk:#b07a12;--head:#eef1ec}
  @media(prefers-color-scheme:dark){:root{--bg:#161a1f;--card:#20262d;--line:#39404a;
        --ink:#e6e9ec;--ink2:#98a1ab;--rail:#e07a63;--bus:#6bb6d6;--i2c:#d8b24e;
        --sig:#8b95a1;--unk:#e0b455;--head:#232a31}}
  </style>
<title>Microduck Block Diagram</title><rect class="bg" x="0" y="0" width="1180" height="760"/><text class="t" x="28" y="40" font-size="22" text-anchor="start" font-weight="700">Microduck — Electronics Block Diagram</text><text class="lbl" x="28" y="62" font-size="12" text-anchor="start">Functional flow. One bus carries all 15 servos + the IMU board; everything else hangs off the Radxa through the HAT. Rails red · digital buses blue · I²C amber.</text><path class="pwr" fill="none" d="M140 186 H140 V300 H140"/><text class="net" x="140" y="239" font-size="9.5" text-anchor="middle">VBAT 6.6–8.2 V</text><path class="pwr" fill="none" d="M450 120 H450 V200 H450"/><text class="net" x="450" y="156" font-size="9.5" text-anchor="middle">5 V</text><path class="pwr" fill="none" d="M240 346 H285 V260 H330"/><text class="net" x="285" y="299" font-size="9.5" text-anchor="middle">5 V / rails</text><path class="bus" fill="none" d="M240 346 H285 V455 H330"/><text class="net" x="285" y="396.5" font-size="9.5" text-anchor="middle">VBAT + DATA (transceiver)</text><path class="bus" fill="none" d="M450 320 H450 V380 H450"/><text class="net" x="450" y="346" font-size="9.5" text-anchor="middle">UART2 /dev/ttyS2</text><path class="bus" fill="none" d="M570 455 H615 V455 H660"/><text class="net" x="615" y="451" font-size="9.5" text-anchor="middle">ID 200 block</text><path class="i2c" fill="none" d="M570 260 H615 V152 H660"/><text class="net" x="615" y="202" font-size="9.5" text-anchor="middle">I²S3 + I²C3</text><path class="i2c" fill="none" d="M570 260 H615 V247 H660"/><text class="net" x="615" y="249.5" font-size="9.5" text-anchor="middle">I²C3 0x29</text><path class="bus" fill="none" d="M570 260 H615 V333 H660"/><text class="net" x="615" y="292.5" font-size="9.5" text-anchor="middle">MIPI CSI</text><path class="sig" fill="none" d="M570 260 H755 V143 H940"/><text class="net" x="755" y="197.5" font-size="9.5" text-anchor="middle">on-module</text><path class="sig" fill="none" d="M240 346 H590 V247 H940"/><text class="net" x="590" y="292.5" font-size="9.5" text-anchor="middle">?</text><rect class="card" x="40" y="110" width="200" height="76" rx="5" fill="var(--head)"/><text class="t" x="52" y="132" font-size="13.5" text-anchor="start" font-weight="700">BATTERY</text><text class="lbl" x="52" y="150" font-size="10.5" text-anchor="start">NP-F550 2S · 6.6–8.2 V · 18.72 Wh</text><rect class="card" x="40" y="300" width="200" height="92" rx="5" fill="var(--head)"/><text class="t" x="52" y="322" font-size="13.5" text-anchor="start" font-weight="700">RPI ROBOT HAT</text><text class="lbl" x="52" y="340" font-size="10.5" text-anchor="start">power path · codec · ToF · transceiver</text><rect class="card" x="330" y="200" width="240" height="120" rx="5" fill="var(--head)"/><text class="t" x="342" y="222" font-size="13.5" text-anchor="start" font-weight="700">RADXA ZERO 3W</text><text class="lbl" x="342" y="240" font-size="10.5" text-anchor="start">RK3566 · 1 GB · 32 GB</text><text class="lbl" x="342" y="254" font-size="10.5" text-anchor="start">Wi-Fi 6 / BT 5.4 · compute</text><rect class="card" x="330" y="380" width="240" height="150" rx="5" fill="var(--head)"/><text class="t" x="342" y="402" font-size="13.5" text-anchor="start" font-weight="700">SERVO BUS</text><text class="lbl" x="342" y="420" font-size="10.5" text-anchor="start">TTL half-duplex 1 Mbps · Protocol 2</text><text class="lbl" x="342" y="434" font-size="10.5" text-anchor="start">16 devices: 15× XL330 + imu_to_dxl</text><text class="lbl" x="342" y="448" font-size="10.5" text-anchor="start">IDs 10–14 / 20–24 / 30–34 + 200</text><rect class="card" x="660" y="420" width="220" height="70" rx="5" fill="var(--head)"/><text class="t" x="672" y="442" font-size="13.5" text-anchor="start" font-weight="700">MOTION IMU</text><text class="lbl" x="672" y="460" font-size="10.5" text-anchor="start">LSM6DSV16X @ ID 200</text><text class="lbl" x="672" y="474" font-size="10.5" text-anchor="start">+ dormant BMI088</text><rect class="card" x="660" y="110" width="220" height="84" rx="5" fill="var(--head)"/><text class="t" x="672" y="132" font-size="13.5" text-anchor="start" font-weight="700">AUDIO</text><text class="lbl" x="672" y="150" font-size="10.5" text-anchor="start">TLV320AIC3104 codec</text><text class="lbl" x="672" y="164" font-size="10.5" text-anchor="start">mic + speaker · I²S3</text><rect class="card" x="660" y="214" width="220" height="66" rx="5" fill="var(--head)"/><text class="t" x="672" y="236" font-size="13.5" text-anchor="start" font-weight="700">DEPTH</text><text class="lbl" x="672" y="254" font-size="10.5" text-anchor="start">VL53L5/L8CX 8×8 ToF</text><text class="lbl" x="672" y="268" font-size="10.5" text-anchor="start">I²C3 0x29 · 15 Hz</text><rect class="card" x="660" y="300" width="220" height="66" rx="5" fill="var(--head)"/><text class="t" x="672" y="322" font-size="13.5" text-anchor="start" font-weight="700">VISION</text><text class="lbl" x="672" y="340" font-size="10.5" text-anchor="start">IMX219 + M12 lens</text><text class="lbl" x="672" y="354" font-size="10.5" text-anchor="start">MIPI CSI · inverted</text><rect class="card" x="330" y="60" width="240" height="60" rx="5" fill="var(--head)"/><text class="t" x="342" y="82" font-size="13.5" text-anchor="start" font-weight="700">USB-C</text><text class="lbl" x="342" y="100" font-size="10.5" text-anchor="start">5 V charge/tether · FUSB302 PD off</text><rect class="card" x="940" y="110" width="200" height="66" rx="5" fill="var(--head)"/><text class="t" x="952" y="132" font-size="13.5" text-anchor="start" font-weight="700">COMMS</text><text class="lbl" x="952" y="150" font-size="10.5" text-anchor="start">Wi-Fi 6 / BT 5.4</text><text class="lbl" x="952" y="164" font-size="10.5" text-anchor="start">gamepad, WebRTC</text><rect class="card" x="940" y="214" width="200" height="66" rx="5" fill="var(--head)"/><text class="t" x="952" y="236" font-size="13.5" text-anchor="start" font-weight="700">NFC</text><text class="lbl" x="952" y="254" font-size="10.5" text-anchor="start">2 antennas (head, beak)</text><text class="lbl" x="952" y="268" font-size="10.5" text-anchor="start">reader IC: unknown</text></svg>
