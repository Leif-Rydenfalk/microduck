<text x="716" y="760" font-size="13" font-weight="700" fill="#1a1f26">How it flows</text>
<text x="716" y="784" font-size="11" fill="#5b6672">Pack → banana PCB → HAT → 5 V (Radxa) + bus VDD (servos).</text>
<text x="716" y="799" font-size="11" fill="#5b6672">One UART carries the whole 16-device servo chain; the control</text>
<text x="716" y="814" font-size="11" fill="#5b6672">IMU (LSM6DSV16X) is one more device on that same bus.</text>
<text x="716" y="829" font-size="11" fill="#5b6672">I2C3 is a single 400 kHz bus: codec, ToF, dormant BMI088.</text>
<text x="716" y="844" font-size="11" fill="#5b6672">Camera is MIPI CSI; audio = I2S3 (data) + I2C3 (control).</text>
