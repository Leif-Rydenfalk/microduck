<text x="34" y="70" font-size="13" fill="#5b6672">Deliverable 1 of 3 — functional flow only, no pins.  Host: Radxa Zero 3W (RK3566).  Facts &amp; cites: docs/ELECTRONICS-AND-SOFTWARE.md.</text>
