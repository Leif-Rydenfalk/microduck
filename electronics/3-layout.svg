<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-size="12">
  <style>
  .bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--line);stroke-width:1}
