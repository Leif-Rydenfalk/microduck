<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#182d3b;font:16px/1.5 system-ui}header{padding:20px 26px;background:white;border-bottom:1px solid #cbd7df}h1{font-size:24px;margin:0}p{margin:7px 0}main{display:grid;grid-template-columns:1fr 280px;height:78vh}canvas{width:100%;height:100%;touch-action:none;background:#edf2f5}aside{padding:20px;background:#fff;overflow:auto}button,select,input{font:inherit;margin:6px 0;width:100%;padding:9px}a{color:#086b8f}small{display:block;color:#566a78}#state{font-size:13px}@media(max-width:750px){main{display:block;height:auto}canvas{height:60vh}aside{padding:16px}}</style>
<header><a href="__BACK__">← Start here / 返回目录</a><h1>__TITLE__</h1><p>Drag to turn • Scroll to zoom / 拖动旋转 · 滚轮缩放</p><small>__SCOPE__</small></header>
<main><canvas id="view"></canvas><aside><strong>Look inside / 查看内部</strong><button id="all">Show everything / 显示全部</button><button id="inside">Remove covers / 隐藏外壳</button><label>Choose a part / 选择零件<select id="part"><option value="all">Whole model / 整体</option></select></label><label>Separate parts / 分开查看<input id="explode" type="range" min="0" max="1" value="0" step=".01"></label><button id="reset">Reset view / 重置视角</button><p id="state">Loading geometry…</p><small>This is a static geometry review. Movement, fit and manufacturing readiness are not verified by this view.<br>此页面用于查看几何形状，不代表运动、装配或生产验证。</small></aside></main>
<script id="geometry" type="application/json">__GEOMETRY__</script><script>
const model=JSON.parse(document.querySelector('#geometry').textContent),canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
if(!gl){document.querySelector('#state').textContent='3D unavailable in this browser. Use the included pictures and STL files. / 浏览器不支持3D，请查看图片及STL文件。';throw Error('WebGL unavailable')}
const vertex=`attribute vec3 p;attribute vec3 n;uniform vec3 center;uniform vec3 offset;uniform vec2 angle;uniform vec2 scale;varying float light;void main(){float c=cos(angle.x),s=sin(angle.x),a=cos(angle.y),b=sin(angle.y);mat3 r=mat3(c,s,0.,-s,c,0.,0.,0.,1.);vec3 q=r*(p-center+offset);vec3 v=vec3(q.x,a*q.y-b*q.z,b*q.y+a*q.z);vec3 nn=r*n;nn=vec3(nn.x,a*nn.y-b*nn.z,b*nn.y+a*nn.z);light=.42+.58*abs(dot(normalize(nn),normalize(vec3(.3,.5,1.))));gl_Position=vec4(v.x*scale.x,v.y*scale.y,-v.z*scale.y*.1,1.);}`;
const fragment=`precision mediump float;uniform vec3 color;varying float light;void main(){gl_FragColor=vec4(color*light,1.);}`;
function shader(t,s){let sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
// Display normals only: preserve mesh vertices and split shading at sharp edges.
function reviewNormals(pos,idx){
 const faces=[],adj=new Map(),key=p=>p.map(x=>Math.round(x*1e5)).join(',');
 for(let j=0;j<idx.length;j+=3){const a=idx.slice(j,j+3).map(k=>pos.slice(k*3,k*3+3)),u=a[1].map((x,k)=>x-a[0][k]),v=a[2].map((x,k)=>x-a[0][k]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n);n=n.map(x=>len?x/len:0);const f={a,n};faces.push(f);for(let c=0;c<3;c++){const x=a[(c+1)%3].map((v,k)=>v-a[c][k]),y=a[(c+2)%3].map((v,k)=>v-a[c][k]),den=Math.hypot(...x)*Math.hypot(...y),weight=den?Math.acos(Math.max(-1,Math.min(1,x.reduce((t,v,k)=>t+v*y[k],0)/den))):0,k=key(a[c]);if(!adj.has(k))adj.set(k,[]);adj.get(k).push({n,weight});}}
 const out=[],crease=Math.cos(Math.PI/6);for(const f of faces)for(const p of f.a){const sum=[0,0,0];for(const q of adj.get(key(p)))if(q.n.reduce((t,v,k)=>t+v*f.n[k],0)>=crease)for(let k=0;k<3;k++)sum[k]+=q.n[k]*q.weight;const len=Math.hypot(...sum);out.push(...(len?sum.map(x=>x/len):f.n));}return out;
}
let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];const meshes=model.parts.map((m,i)=>{let pos=m.positions,idx=m.indices||Array.from({length:pos.length/3},(_,j)=>j),v=[],n=[],mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];for(let j=0;j<idx.length;j+=3){let a=idx.slice(j,j+3).map(k=>pos.slice(k*3,k*3+3)),u=a[1].map((x,k)=>x-a[0][k]),w=a[2].map((x,k)=>x-a[0][k]),normal=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];for(let p of a){v.push(...p);n.push(...normal);p.forEach((x,k)=>{mn[k]=Math.min(mn[k],x);mx[k]=Math.max(mx[k],x);lo[k]=Math.min(lo[k],x);hi[k]=Math.max(hi[k],x)})}}function buf(data){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);return b}let option=document.createElement('option');option.value=i;option.textContent=m.name;document.querySelector('#part').append(option);return {...m,p:buf(v),n:buf(reviewNormals(pos,idx)),count:v.length/3,lo:mn,hi:mx,mid:mn.map((x,k)=>(x+mx[k])/2)}});
let yaw=-2.55,pitch=-1.03,zoom=1,mode='all';const center=lo.map((x,k)=>(x+hi[k])/2),extent=Math.max(...hi.map((x,k)=>x-lo[k]));const loc=k=>gl.getUniformLocation(prog,k);gl.enable(gl.DEPTH_TEST);
function draw(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.93,.95,.97,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let picked=document.querySelector('#part').value,focus=picked==='all'?null:meshes[+picked],cen=focus?focus.mid:center,size=focus?Math.max(...focus.hi.map((x,k)=>x-focus.lo[k])):extent;gl.uniform3fv(loc('center'),cen);gl.uniform2f(loc('angle'),yaw,pitch);gl.uniform2f(loc('scale'),1.5*zoom/size*canvas.height/canvas.width,1.5*zoom/size);let count=0;for(let [i,m] of meshes.entries()){if(focus&&m!==focus)continue;if(mode==='inside'&&/shell|face-part|eye-ring|soft-mouth/.test(m.name))continue;for(let k of ['p','n']){let a=gl.getAttribLocation(prog,k);gl.bindBuffer(gl.ARRAY_BUFFER,m[k]);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0)}gl.uniform3fv(loc('color'),m.color||[.45,.65,.76]);let e=+document.querySelector('#explode').value;gl.uniform3fv(loc('offset'),m.mid.map((x,k)=>(x-center[k])*e));gl.drawArrays(gl.TRIANGLES,0,m.count);count++}document.querySelector('#state').textContent=`${count} / ${meshes.length} pieces visible · ${model.units||'mm'} / 个零件可见`;window.__review={total:meshes.length,visible:count,triangles:meshes.reduce((a,m)=>a+m.count/3,0),bounds:[lo,hi],draws:(window.__review?.draws||0)+1}}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];draw()}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw()};document.querySelector('#all').onclick=()=>{mode='all';document.querySelector('#part').value='all';draw()};document.querySelector('#inside').onclick=()=>{mode='inside';document.querySelector('#part').value='all';draw()};document.querySelector('#part').onchange=()=>{mode='all';zoom=1;draw()};document.querySelector('#explode').oninput=draw;document.querySelector('#reset').onclick=()=>{yaw=-2.55;pitch=-1.03;zoom=1;mode='all';document.querySelector('#part').value='all';document.querySelector('#explode').value=0;draw()};window.onresize=draw;draw();
</script></html>
