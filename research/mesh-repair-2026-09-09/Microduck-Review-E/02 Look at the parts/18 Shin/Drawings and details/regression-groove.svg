<text x="12.0000" y="241.9625" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   MEASURED OVER THE WHOLE SOLID BY RAY+EXACT</text>
<text x="12.0000" y="247.2125" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   AT 0.8220 mm SAMPLE SPACING (A FEATURE</text>
<text x="12.0000" y="252.4625" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   NARROWER THAN THAT CAN BE MISSED). THIS IS A</text>
<text x="12.0000" y="257.7125" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   DISTANCE THROUGH MATERIAL, NOT A WALL: AT AN</text>
<text x="12.0000" y="262.9625" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   EDGE, A FILLET RUN-OUT OR A CHAMFER TIP IT</text>
<text x="12.0000" y="268.2125" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   IS REAL AND UNPRINTABLE BY DEFINITION. DO</text>
<text x="12.0000" y="273.4625" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   NOT JUDGE PRINTABILITY BY IT — THE NEXT NOTE</text>
<text x="12.0000" y="278.7125" font-size="3.500" fill="#12283c" text-anchor="start" stroke="none">   IS THE ONE THAT DOES.</text>
