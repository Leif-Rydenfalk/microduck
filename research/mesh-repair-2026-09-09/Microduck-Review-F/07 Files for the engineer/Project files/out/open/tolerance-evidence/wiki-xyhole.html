3) hr{display:none}</style><!-- ============================================================
     首页语言自动跳转（独立模块，与其它脚本隔离，勿与其它代码合并）
     ------------------------------------------------------------
     背景：访问根路径 / 时，Wiki.js 服务端会 302 到默认语言首页 /en/home。
     本脚本在落到 /en/home 后，按用户意图决定是否再跳到其语言首页。
     属于二次跳转（/ -> /en/home -> /<lang>/home），是纯前端方案的固有代价。

     意图来源（cookie `wiki_lang`，由 body 脚本在用户点击语言菜单时写入，
     含点选 English 时写 en）：
       - cookie 是非 en 语言 -> 跳到该语言首页（用户明确选过它）；
       - cookie 是 en        -> 留在英文首页（用户明确选过英文）；
       - 没有 cookie（新用户，从没选过）-> 按浏览器语言跳一次（不写 cookie，
         待用户主动选语言后才“锁定”）。
     纯由 cookie 驱动，无需 sessionStorage：选了什么就一直是什么，直到再次选择。

     维护：SUPPORTED 需与 body 中 LANGUAGES 的 locale 码保持一致；新增语言两处都要加。
     ============================================================ -->
  <script type="text/javascript">
  (function () {
    var DEFAULT_LOCALE = 'en';
    var HOME = 'home';
    // 与 body 的 LANGUAGES locale 码保持一致（新增语言两处都要改）
    var SUPPORTED = ['en','zh','pt-br','de','es','fr','it','nl','ja','ko','ru','tr','pl','cs','hu','ro','sv','el'];
    var COOKIE = 'wiki_lang';

    function getCookie(name) {
      var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    // 仅在「默认语言首页 /en/home」上考虑自动跳转，不影响其它页面。
    var seg = location.pathname.split('/').filter(Boolean); // ['en','home'] 等
    var firstSeg = (seg[0] || '').toLowerCase();
    var isDefaultHome = (firstSeg === DEFAULT_LOCALE && (seg[1] || '') === HOME && seg.length === 2);
    if (!isDefaultHome) return;

    var cookieLang = getCookie(COOKIE);
    if (cookieLang && SUPPORTED.indexOf(cookieLang) >= 0) {
      // 用户有明确选择：非 en 则跳过去，en 则留下。
      if (cookieLang !== DEFAULT_LOCALE) {
        location.replace('/' + cookieLang + '/' + HOME + location.search + location.hash);
      }
      return;
    }

    // 没有有效 cookie（新用户）：按浏览器语言跳一次，但不写 cookie。
    function pickByBrowser() {
      var langs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < langs.length; i++) {
        var l = (langs[i] || '').toLowerCase();
        if (SUPPORTED.indexOf(l) >= 0) return l;        // 如 pt-br 直接命中
        var base = l.split('-')[0];
        if (SUPPORTED.indexOf(base) >= 0) return base;  // 如 zh-cn -> zh
      }
      return null;
    }
    var target = pickByBrowser();
    if (!target || target === DEFAULT_LOCALE) return;   // 无匹配或就是英文 -> 留下
    location.replace('/' + target + '/' + HOME + location.search + location.hash);
  })();
  </script>

  <script type="text/javascript" defer>

  function GetQueryString(sGet, name) {
      var reg = new RegExp("(^|&)"+ name +"=([^&]*)(&|$)");
      var r = sGet.match(reg);
      if(r != null) {
          return unescape(r[2]);
      } else {
          return null;
      }
  }

  function getUrlQuery(name) {
      let reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
      let r = window.location.search.substr(1).match(reg);
      if (r != null) {
          return decodeURIComponent(r[2]);
      };

      return null;
  }


  function parseUrl(url) {
      if(url.startsWith('//')) {
          url = location.protocol + url;
      }
      return new window.URL(url);
  }

  function removeUrlParam(param, url = window.location.href) {
      let obj = parseUrl(url);
      obj.searchParams.delete(param);
      return obj.href;
  }

  function SetMaskIconColor() {
      document.querySelector('link[rel="mask-icon"]').setAttribute('color', '#00AE42');
  }

  function HandleVideoHtml() {
      // const rxYoutube = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/)|(?:(?:watch)?\?v(?:i)?=|\&v(?:i)?=))([^#\&\?]*).*/
      // the old regex will match https://www.copyright.gov/registration
      const rxYoutube = /^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
      const rxVimeo = /^.*(vimeo\.com\/)((channels\/[A-z]+\/)|(groups\/[A-z]+\/videos\/))?([0-9]+)/

      document.querySelectorAll('.contents oembed, .contents a').forEach(elm => {
          const url = elm.hasAttribute('url') ? elm.getAttribute('url') : elm.getAttribute('href')
          if (url == null)
              return;

          let newElmHtml = null
          let nWen = url.indexOf('?');
          let GetParam = '';
          let BiliMatch = false;
          let BiliVID = '';
          if(nWen >= 0) {
              GetParam = url.substr(nWen + 1);
              //alert(GetParam);
              let sSrc = GetQueryString(GetParam, 'src');
              let sV = GetQueryString(GetParam, 'v');
              if(sSrc != null && sV != null && sSrc == 'bilibili') {
                  BiliMatch = true;
                  BiliVID = sV;
              }
          }
          const ytMatch = url.match(rxYoutube)
          const vmMatch = !ytMatch && url.match(rxVimeo)
          if(BiliMatch) {
              newElmHtml = '<iframe src="https://player.bilibili.com/player.html?p=1&autoplay=0&bvid=' + BiliVID + '" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" width="100%" height="100%"> </iframe>';
          } else if(ytMatch) {
              newElmHtml = `<iframe id="ytplayer" type="text/html" width="640" height="360" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen></iframe>`
          } else if(vmMatch) {
              newElmHtml = `<iframe id="vmplayer" type="text/html" width="640" height="360" src="https://player.vimeo.com/video/${vmMatch[5]}" frameborder="0" allowfullscreen></iframe>`
          } else if(url.endsWith('.mp4')) {
              newElmHtml = `<video controls autostart="0" name="media" width="640" height="360"><source src="${url}" type="video/mp4"></video>`
          } else {
              return
          }

          const container = document.createElement('div')
          container.classList.add('video-responsive')

          const inner = document.createElement('div')
          inner.classList.add('video-responsive-inner')

          inner. insertAdjacentHTML('beforeend', newElmHtml)
          container.append(inner)

          elm.replaceWith(container)
      })
  }

  function HandleSearchPage() {
      const search = getUrlQuery('search')
      if(search) {
          const isAPP = window.innerWidth < 960
          console.log("isAPP: " + isAPP)
          const headerInner = document.querySelector("header.nav-header.v-sheet.theme--dark.v-toolbar.v-toolbar--flat.v-app-bar.v-app-bar--clipped.v-app-bar--fixed.black")
          const input = headerInner.__vue__.$parent
          console.log(input)
          if(input) {
              if(isAPP) {
                  input.searchIsShown = true
              }
              input.search = search
              const target = document.querySelector('.v-application--wrap')
              const observe = new MutationObserver(function(mutations, observe) {
                  mutations.forEach((mutation) => {
                      const nodes = Array.from(mutation.addedNodes)
                      if(nodes.length > 0) {
                          nodes.forEach((node) => {
                              if(node.nodeType === 1) {
                                  if(node.classList.contains('search-results')) {
                                      const btn = document.querySelector('.search-results div.text-xs-center .mx-2.v-btn')
                                      if(btn) {
                                          console.log(btn)
                                          btn.onclick = function() {
                                              const url = removeUrlParam('search')
                                              window.location.href = url
                                          }
                                      }
                                  }
                              }
                          })
                      }
                  })
              });
              observe.observe(target, {
                  childList: true
              });
          }
      }
  }

  function HandleViewerJS()
  {
    const imageContent = document.querySelector('div.contents')
    if (imageContent) {
      const gallery = new Viewer(imageContent,{title:false})
      imageContent.querySelectorAll('img').forEach((item, index) => {
        item.addEventListener('click', () => {
          gallery.view(index)
        })
      })
    }
  }

  const LangMap = {
    en: 'en',
    zh: 'zh-CN'
  }

  const i18n = {
    [LangMap.en]: {
      Comments: "Comments"
    },
    [LangMap.zh]: {
      Comments: "评论"
    }
  }

  function InitArtalk() {
    // 获取class为contents的div元素
    const contentsDiv = document.querySelector('div.contents');

    const pathnameSplit = location.pathname.split('/')
    const lang = LangMap[pathnameSplit[1]] || 'en'

    // 检查元素是否存在，避免报错
    if (contentsDiv) {
      // 在目标元素后面插入新的div
      contentsDiv.insertAdjacentHTML('afterend',
  `<div id="discussion" class="comments-container">
    <div class="comments-header">
      <i aria-hidden="true" class="v-icon notranslate mr-2 mdi mdi-comment-text-outline theme--dark"></i>
      <span>${i18n[lang].Comments}</span>
    </div>
    <div class="comments-main">
      <div>
        <div id="artalk-container"></div>
      </div>
    </div>
  </div>`);
    } else {
      console.warn('未找到class为contents的div元素');
    }

    window.artalk = Artalk.init({
      el:        '#artalk-container',
      pageTitle: '',         // 页面标题 (留空自动获取)
      server:    'https://artalk.bambulab.com',
      site:      'bambulab wiki',
      locale:    lang,
    })
  }

  window.boot.register('vue', () => {

      // window.onload = () => {
      //    SetMaskIconColor();
      //       HandleVideoHtml();
      //      HandleSearchPage();
      //}

      window.addEventListener('load', () => {
          SetMaskIconColor();
           HandleVideoHtml();
          HandleSearchPage();
          HandleViewerJS();
          InitArtalk();
      })
  })

  </script>

<script>
  (function() {
    var origFetch = window.fetch;
    window.fetch = function(url, opts) {
      if (opts && opts.body && typeof opts.body === 'string' && opts.body.includes('search')) {
        try {
          var payload = JSON.parse(opts.body);
          var list = Array.isArray(payload) ? payload : [payload];
          var modified = false;
          list.forEach(function(body) {
            if (body.query && body.query.includes('pages') && body.query.includes('search(query:')) {
              // 当前内容语言以 URL 路径首段为准（/zh/xxx -> zh），与站内其它逻辑一致。
              // 不用 document.documentElement.lang：它反映的是界面语言（可能一直是 en），
              // 还可能被 Chrome 网页翻译等改动，导致搜索 locale 恒为 en。
              var seg = location.pathname.split('/').filter(Boolean);
              var locale = (seg[0] || 'en').toLowerCase();
              body.query = body.query
                .replace('($query: String!)', '($query: String!, $locale: String)')
                .replace(/search\(query:\s*\$query\)/, 'search(query: $query, locale: $locale)');
              body.variables = body.variables || {};
              body.variables.locale = locale;
              modified = true;
            }
          });
          if (modified) {
            opts.body = JSON.stringify(Array.isArray(payload) ? list : list[0]);
          }
        } catch(e) {}
      }
      return origFetch.call(this, url, opts);
    };
  })();
  </script>

<p>You may need XY compensation if:</p>
<ul>
<li>Screws or bolts do not fit into printed holes.</li>
<li>Pins or shafts feel too tight.</li>
<li>Assembled parts require sanding or force to fit.</li>
<li>Measured hole diameters are smaller than the designed values.</li>
</ul>
<p><strong>This can lead to frustration, let's explore how to improve part precision!</strong><br>
<img src="/software/bambu-studio/xy-hole-contour-compensation/screw_doesnt_fit.gif" alt="screw_doesnt_fit.gif" width="600"></p>
<br>
<h2 id="what-is-xy-hole-and-contour-compensation" class="toc-header"><a class="toc-anchor" href="#what-is-xy-hole-and-contour-compensation">¶</a> What is XY Hole and Contour Compensation?</h2>
<p><strong>XY compensation</strong> is a feature in Bambu Studio that helps correct part dimensions.</p>
<p>It has two separate settings, both are used to improve fit and dimensional accuracy:</p>
<ul>
<li>
<p><strong>XY Hole Compensation</strong><br>
Adjusts the size of holes (closed, hollow areas) in each layer.<br>
It only affects holes and does not change the outer size of the model.</p>
</li>
<li>
<p><strong>XY Contour Compensation</strong><br>
Adjusts the outer contour of the model.<br>
It increases or decreases the overall XY size while keeping hole sizes unchanged.</p>
</li>
</ul>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/hole_vs_contour_wiki.jpg" alt="hole_vs_contour_wiki.jpg" width="600"></p>
<br>
<h2 id="when-to-use" class="toc-header"><a class="toc-anchor" href="#when-to-use">¶</a> When to use?</h2>
<p>Use XY Hole Compensation and XY Contour Compensation when a model requires accurate fitting with other components, such as screws, pins, magnets, or other printed parts. These settings allow you to fine-tune dimensions to achieve proper and reliable fits.</p>
<br>
<h2 id="related-issues-with-similar-symptoms" class="toc-header"><a class="toc-anchor" href="#related-issues-with-similar-symptoms">¶</a> Related issues with similar symptoms</h2>
<p>Other factors can affect model dimensional accuracy. Check and correct these issues before adjusting XY Hole Compensation or XY Contour Compensation.</p>
<ul>
<li><a href="/en/knowledge-sharing/3d-prints-shrinkage" class="is-internal-link is-valid-page">Material shrinkage</a>, filament contracts as it cools. This can make holes smaller.</li>
<li><a href="/en/software/bambu-studio/parameter/elephant-foot" class="is-internal-link is-valid-page">Elephant’s foot</a> from excessive first-layer squish on the Build Plate.</li>
<li><a href="/en/filament-acc/filament/dry-filament" class="is-internal-link is-valid-page">Moist filament</a> causing inconsistent extrusion.</li>
<li><a href="/en/software/bambu-studio/calibration_pa" class="is-internal-link is-valid-page">Flow dynamics</a> not properly tuned.</li>
<li>Hole diameters close to the Nozzle size, holes below 1 mm can be challenging to tune.</li>
<li>Lack of chamfers or lead-in features on holes.</li>
<li><a href="/en/software/bambu-studio/Seam" class="is-internal-link is-valid-page">Seam</a>, this feature can affect hole precision.</li>
</ul>
<br>
<h2 id="how-to-calibrate-xy-hole-compensation" class="toc-header"><a class="toc-anchor" href="#how-to-calibrate-xy-hole-compensation">¶</a> How to Calibrate XY Hole Compensation</h2>
<h3 id="step-1-print-a-test-model" class="toc-header"><a class="toc-anchor" href="#step-1-print-a-test-model">¶</a> Step 1. Print a Test Model</h3>
<p>Use a calibration model with multiple known hole sizes.<br>
There are hundreds of test models on Makerworld. Most require calipers to measure and correct.<br>
<a href="https://makerworld.com/en/models/2172726-xy-hole-compensation-without-calipers#profileId-2356775" class="is-external-link">This model by Lebadjuras uses a known metric screw size</a>, which are standard across the world to test the hole sizes. You can use an M3, M4, M5 or M6, depending on what you may have available.</p>
<blockquote>
<p>ℹ️ <strong>Note:</strong> Print the model using the same <strong>Process profile and Filament you plan to use for your final part</strong>.<br>
This calibration is <strong>specific to each filament</strong> and should be repeated when changing materials.</p>
</blockquote>
<ul>
<li><a href="https://makerworld.com/en/models/2172726-xy-hole-compensation-without-calipers#profileId-2356775" class="is-external-link">Open the model</a> in Bambu Studio (1) and print it, using your desired filament and print profile.</li>
</ul>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/makerworld_xy_hole_wiki.jpg" alt="makerworld_xy_hole_wiki.jpg" width="800"><br>
<br></p>
<p>In this example, an <strong>M6 screw is used</strong>. Larger screws produce more accurate calibration results, so using an M6 screw is recommended.<br>
<br></p>
<blockquote>
<p>ℹ️ <strong>Note:</strong> An M6 screw has a nominal size of 6.0 mm, but the actual diameter is usually smaller due to manufacturing tolerances.<br>
Most M6 screws follow the ISO 6g standard, which intentionally makes the thread slightly smaller to ensure easy assembly. In practice, the diameter is typically around 5.9 mm.<br>
<img src="/software/bambu-studio/xy-hole-contour-compensation/m6_screw_diameter.png" alt="m6_screw_diameter.png" width="400"></p>
</blockquote>
<p><strong>Set XY Hole Compensation to 0 mm</strong>, and print the model.<br>
Notice that the M6 hole measures 5.9 mm, which matches the screw diameter. The screw should fit very tightly.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/true_diameters_m6.png" alt="true_diameters_m6.png" width="1000"><br>
<br></p>
<h3 id="step-2-test-the-holes" class="toc-header"><a class="toc-anchor" href="#step-2-test-the-holes">¶</a> Step 2. Test the Holes</h3>
<p>Using your available screw size, test which hole fits the screw snugly. It shouldn't have any wobble.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/noxyhole_compensation.gif" alt="noxyhole_compensation.gif" width="800"></p>
<p>After checking which hole fits ensures a precise fit, register the number. <strong>In this case, + 0.15</strong>.</p>
<!-- 
> **If you have a set of Calipers**, you can just measure the M6 hole. In this case the original measurment was 5.66 mm which means the hole is 0.24 mm undersized. After inserting half of that value in Bambu Studio, the hole is now 0.04 Oversized.
> This is great, **it is impossible to reach a perfect precision** as both machine tolerances and reading tolerances impact the final dimensions.
> ![xy_hole_compensation_real_world.png](/software/bambu-studio/xy-hole-contour-compensation/xy_hole_compensation_real_world.png =800x)
-->
<br>
<h3 id="step-3-apply-the-setting-in-bambu-studio" class="toc-header"><a class="toc-anchor" href="#step-3-apply-the-setting-in-bambu-studio">¶</a> Step 3. Apply the Setting in Bambu Studio</h3>
<p>Go to <strong>Process</strong> ⏩ <strong>Quality</strong> ⏩ <strong>Precision</strong></p>
<p>Enter the registered value in <strong>XY Hole Compensation</strong></p>
<p>The hole diameter will increase by twice the compensation value, as shown in the image below.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/xy_hole_compensation.png" alt="xy_hole_compensation.png" width="1000"></p>
<p>Click the <strong>Save icon</strong> (1) and rename the <strong>Process Profile</strong> for easy reference (2).<br>
Then click <strong>OK</strong> (3).</p>
<p>This saved profile can be reused as your custom <strong>precision fit profile</strong>.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/save_the_profile_wiki.jpg" alt="save_the_profile_wiki.jpg" width="800"><br>
<br></p>
<h3 id="step-4-validate" class="toc-header"><a class="toc-anchor" href="#step-4-validate">¶</a> Step 4. Validate</h3>
<p>Reprint with the <strong>modified print process and test again</strong>.<br>
This time the screw should fit the correct Metric size (M3, M4, M5 or M6).</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/afterocmpensation.gif" alt="afterocmpensation.gif" width="800"><br>
<br></p>
<h3 id="step-5-iterate-if-needed" class="toc-header"><a class="toc-anchor" href="#step-5-iterate-if-needed">¶</a> Step 5. Iterate if needed</h3>
<p>If for some reason the screw doesn't fit the correct Metric size hole, identify what hole it fits in. Add the new hole value to the previously registered value in Bambu Studio.</p>
<blockquote>
<p><strong>For example,</strong> in Step 3 you set XY Hole Compensation to 0.2 mm. After printing the calibration model again, the screw fits correctly in the +0.1 mm hole. In this case, add the values together:</p>
<ul>
<li><strong>0.2 mm + 0.1 mm = 0.3 mm</strong></li>
<li><strong>Set XY Hole Compensation to 0.3 mm.</strong></li>
</ul>
<p>Repeat this process as needed until the desired fit is achieved.<br>
If all holes become noticeably too large at any point, restart the calibration process and return to <strong>Step 1</strong>.<br>
<br></p>
</blockquote>
<h2 id="how-to-calibrate-xy-contour-compensation" class="toc-header"><a class="toc-anchor" href="#how-to-calibrate-xy-contour-compensation">¶</a> How to Calibrate XY Contour Compensation</h2>
<h3 id="step-1-print-a-test-model-1" class="toc-header"><a class="toc-anchor" href="#step-1-print-a-test-model-1">¶</a> Step 1. Print a Test Model</h3>
<p>Use a <a href="https://makerworld.com/en/models/2172676-xy-contour-calibration-without-calipers#profileId-2356707" class="is-external-link">calibration model with multiple known outer sizes</a>. There are hundreds of test models on Makerworld. Most require calipers to measure and correct.</p>
<p>This <a href="https://makerworld.com/en/models/2172676-xy-contour-calibration-without-calipers#profileId-2356707" class="is-external-link">model by Lebadjuras uses a known reference size</a> that is available to most users: an <strong>original Bambu Lab Reusable Spool</strong>.<br>
For accurate calibration, an original Bambu Lab Reusable Spool must be used.</p>
<p>⚠️ <em>3D printed spools are not suitable, as their dimensions may vary and affect the results!</em> ⚠️️️</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/makerworld_xy_contour_wiki.jpg" alt="makerworld_xy_contour_wiki.jpg" width="800"><br>
<br></p>
<h3 id="step-2-test-the-fitting-in-a-bambu-lab-spool" class="toc-header"><a class="toc-anchor" href="#step-2-test-the-fitting-in-a-bambu-lab-spool">¶</a> Step 2. Test the Fitting in a Bambu Lab Spool</h3>
<p>After the model has been printed, try to fit it inside the middle of the Bambu Lab Spool.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/spool_side_wiki.jpg" alt="spool_side_wiki.jpg" width="800"></p>
<p>It should fit tightly, without any play. It should also hold in place and not fall inside the spool center hole:<br>
<img src="/software/bambu-studio/xy-hole-contour-compensation/perfectfit_wiki.jpg" alt="perfectfit_wiki.jpg" width="800"></p>
<p>Below you can find two examples of poor fittings:<br>
<img src="/software/bambu-studio/xy-hole-contour-compensation/fit_check.png" alt="fit_check.png" width="800"></p>
<blockquote>
<p>If you have a set of <strong>calipers</strong>, this job is much quicker:</p>
<ul>
<li>Measure the part diameter and register the measured value.</li>
<li>Subtract ( <strong>55 - [Measured value]</strong> ), then divide by 2 , the resulting value should be inserted into the XY Contour Compensation.</li>
</ul>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/caliper_measurment_.jpg" alt="caliper_measurment_.jpg" width="800"></p>
<ul>
<li>Skip to <strong>Step 4</strong>.</li>
</ul>
</blockquote>
<p>If you <strong>don't have a set of calipers</strong>, don't worry, follow the next Step.<br>
<br></p>
<h3 id="step-3-iterate-the-fitting" class="toc-header"><a class="toc-anchor" href="#step-3-iterate-the-fitting">¶</a> Step 3. Iterate the Fitting</h3>
<p>Without an accurate measuring tool, we will have to iterate the XY Contour value and reprint the part until we achieve the desired fit.</p>
<ul>
<li>If <strong>the part is too loose in the spool center</strong>, you will need to increase the value, try increments of <strong>0.1 mm</strong> until the right fit is achieved.</li>
<li>If <strong>the part doesn't fit in the spool center</strong>, you will need to decrease the value, try increments of <strong>-0.1 mm</strong> until the right fit is achieved.</li>
</ul>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/iteration_wiki.jpg" alt="iteration_wiki.jpg" width="500"></p>
<br>
<h3 id="step-4-save-the-profile" class="toc-header"><a class="toc-anchor" href="#step-4-save-the-profile">¶</a> Step 4. Save the profile</h3>
<p>Once the desired fit is achieved. Click the <strong>Save icon</strong> (1) and rename the <strong>Process Profile</strong> for easy reference (2).<br>
Then click <strong>OK</strong> (3).</p>
<p>This saved profile can be reused as your custom <strong>precision fit profile</strong>.</p>
<p><img src="/software/bambu-studio/xy-hole-contour-compensation/save_process_wiki.jpg" alt="save_process_wiki.jpg" width="800"><br>
<br></p>
<h2 id="limitations" class="toc-header"><a class="toc-anchor" href="#limitations">¶</a> Limitations</h2>
<p>X-Y Hole Compensation only applies to closed paths. If the model has openings on its sides, resulting in unclosed paths within a single layer, the X-Y Hole Compensation function cannot be used.</p>
<p>Take the model in the image below as an example. It has several holes on its side, which cause some intermediate layers to be unclosed. Therefore, these layers do not have holes (as seen in layer 74 in the right image) and will not be affected by X-Y Hole Compensation. Only X-Y Contour Compensation can be applied to them.</p>
<p><img src="https://wiki.bambulab.com/software/bambu-studio/xy-hole-contour-compensation/%E4%BB%85%E6%9C%89%E5%A4%96%E8%BD%AE%E5%BB%93%E6%97%A0%E5%AD%94.png" alt="" width="800"></p>
<p>If <strong>X-Y Hole Compensation</strong> is applied to a model with unclosed paths, noticeable layer separation will occur at the hole locations.</p>
<p><img src="/software/bambu-studio/ksr-fdm-test/real_model_wiki.jpg" alt="real_model_wiki.jpg" width="800"><br>
<br></p>

    function cleanBrackets(el) {
      if (!el) return;

            return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
          }).forEach(function(el) { container.appendChild(el); });
          container.setAttribute('data-sorted', 'true');
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  })();
</script>
