<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 394" width="1330" height="394" font-size="12">
  <style>
  .bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--line);stroke-width:1}
  .pwr{stroke:var(--rail);stroke-width:2.2} .bus{stroke:var(--bus);stroke-width:1.6}
  .i2c{stroke:var(--i2c);stroke-width:1.4} .sig{stroke:var(--sig);stroke-width:1.1}
  .t{fill:var(--ink);font-family:'Source Serif 4',Georgia,serif}
  .m{fill:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace}
  .lbl{fill:var(--ink2);font-family:'Source Sans 3',-apple-system,Arial,sans-serif}
  .net{fill:var(--bus);font-family:'IBM Plex Mono',monospace}
  .unk{fill:var(--unk)}
  :root{--bg:#ffffff;--card:#fbfaf7;--line:#d7d3ca;--ink:#1a1a1a;--ink2:#565656;
        --rail:#9a2b1e;--bus:#243b53;--i2c:#8a5a00;--sig:#8b8b83;--unk:#8a5a00;--head:#f2efe8}
  </style>
<title>Microduck schematic — Camera / audio endpoints</title><rect class="bg" x="0" y="0" width="1330" height="394"/><text class="t" x="28" y="40" font-size="20" text-anchor="start" font-weight="700">Microduck Schematic — Camera / audio endpoints</text><text class="lbl" x="28" y="60" font-size="11" text-anchor="start">Every component, every pin, and the NET each pin connects to (trace a net name to every other pin that carries it). Power red · bus blue · I²C amber. UNKNOWN = not published.</text><rect class="card" x="40" y="80" width="250" height="162" rx="4"/><rect class="card" x="40" y="80" width="250" height="22" rx="4" fill="var(--head)"/><text class="t" x="49" y="95" font-size="12" text-anchor="start" font-weight="700">camera</text><text class="lbl" x="281" y="95" font-size="9.5" text-anchor="end">IMX219</text><line class="pwr" x1="290" y1="113" x2="304" y2="113"/><text class="m" x="49" y="117" font-size="10.5" text-anchor="start">GND</text><text class="pwr" x="308" y="117" font-size="9.5" text-anchor="start">GND</text><line class="pwr" x1="290" y1="130" x2="304" y2="130"/><text class="m" x="49" y="134" font-size="10.5" text-anchor="start">VCC_3V3</text><text class="pwr" x="308" y="134" font-size="9.5" text-anchor="start">VCC_3V3_CSI</text><line class="bus" x1="290" y1="147" x2="304" y2="147"/><text class="m" x="49" y="151" font-size="10.5" text-anchor="start">CSI_CLK</text><text class="bus" x="308" y="151" font-size="9.5" text-anchor="start">csi/CLK</text><line class="bus" x1="290" y1="164" x2="304" y2="164"/><text class="m" x="49" y="168" font-size="10.5" text-anchor="start">CSI_D0</text><text class="bus" x="308" y="168" font-size="9.5" text-anchor="start">csi/D0</text><line class="bus" x1="290" y1="181" x2="304" y2="181"/><text class="m" x="49" y="185" font-size="10.5" text-anchor="start">CSI_D1</text><text class="bus" x="308" y="185" font-size="9.5" text-anchor="start">csi/D1</text><line class="i2c" x1="290" y1="198" x2="304" y2="198"/><text class="m" x="49" y="202" font-size="10.5" text-anchor="start">I2C2_SDA</text><text class="i2c" x="308" y="202" font-size="9.5" text-anchor="start">i2c2/SDA</text><line class="i2c" x1="290" y1="215" x2="304" y2="215"/><text class="m" x="49" y="219" font-size="10.5" text-anchor="start">I2C2_SCL</text><text class="i2c" x="308" y="219" font-size="9.5" text-anchor="start">i2c2/SCL</text><line class="bus" x1="290" y1="232" x2="304" y2="232"/><text class="m" x="49" y="236" font-size="10.5" text-anchor="start">PDN</text><text class="bus" x="308" y="236" font-size="9.5" text-anchor="start">csi17</text><rect class="card" x="470" y="80" width="250" height="60" rx="4"/><rect class="card" x="470" y="80" width="250" height="22" rx="4" fill="var(--head)"/><text class="t" x="479" y="95" font-size="12" text-anchor="start" font-weight="700">speaker</text><text class="lbl" x="711" y="95" font-size="9.5" text-anchor="end">speaker</text><line class="sig" x1="720" y1="113" x2="734" y2="113"/><text class="m" x="479" y="117" font-size="10.5" text-anchor="start">SPK+</text><text class="net" x="738" y="117" font-size="9.5" text-anchor="start">SPK_P</text><line class="sig" x1="720" y1="130" x2="734" y2="130"/><text class="m" x="479" y="134" font-size="10.5" text-anchor="start">SPK-</text><text class="net" x="738" y="134" font-size="9.5" text-anchor="start">SPK_N</text><rect class="card" x="900" y="80" width="250" height="77" rx="4"/><rect class="card" x="900" y="80" width="250" height="22" rx="4" fill="var(--head)"/><text class="t" x="909" y="95" font-size="12" text-anchor="start" font-weight="700">mic</text><text class="lbl" x="1141" y="95" font-size="9.5" text-anchor="end">mic</text><line class="pwr" x1="1150" y1="113" x2="1164" y2="113"/><text class="m" x="909" y="117" font-size="10.5" text-anchor="start">GND</text><text class="pwr" x="1168" y="117" font-size="9.5" text-anchor="start">GND</text><line class="sig" x1="1150" y1="130" x2="1164" y2="130"/><text class="m" x="909" y="134" font-size="10.5" text-