# project.toml — what this project IS, and every way in to it.
#
# Read by `ce.project` and rendered by the CE-CAD dashboard. Everything here is
# DECLARED by the project itself; the service composes it with what it can
# measure (the triad, the repo, the ports actually listening, the work board,
# the print farm).
#
# Rule: a link goes in this file only when it exists. An aspirational URL here
# becomes a dead link on a dashboard somebody trusts.

[project]
name   = "microduck"
title  = "Leif's quadruped robot - a reverse-engineered, buildable Pollen-class walker"
status = "in review - package v0005 issued; Leif sent it to Ming himself"
kind   = "design"
root   = "triad"

[[owners]]
name = "Leif"
role = "designed and built it"

[[links]]
label = "the design repo"
url   = "https://github.com/Leif-Rydenfalk/microduck"
kind  = "repo"

[[links]]
label = "review packages and what happened to them"
path  = "reviews/DELIVERY-LOG.md"
kind  = "doc"
