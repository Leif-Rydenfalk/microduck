# microduck — the design repo's own launch contract (launchpad reads this)
[launch]
contract = 1

[launch.targets.buildbook]
summary     = "Microduck Build Book served live over the real repo files"
supervision = "manual"
cmd         = ["python3", "-m", "http.server", "8842"]
cwd         = "."
start_hint  = "tools/serve.sh in ~/dev/ce-workshop/ce-designs/microduck (opens the page)"
node        = "local"

[launch.targets.buildbook.bind]
port  = 8842
hosts = ["127.0.0.1"]

[launch.targets.buildbook.stop]
method = "signal"
signal = "TERM"
escalate = true
safe_to_stop = true

[launch.targets.buildbook.health]
url           = "http://127.0.0.1:8842/BUILD-BOOK.html"
expect_status = 200
expect_body   = "Microduck Build Book"
# measured 2026-09-02: /no-such-page-xyz answers 404 (python http.server is not a catch-all SPA)
expect_404    = "http://127.0.0.1:8842/no-such-page-xyz"
